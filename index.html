<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>URBAN RUN — Triple Black Showroom</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#fff;font:15px system-ui,Arial;overflow:hidden}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:18px;background:linear-gradient(#090a0ef0,transparent)}h1{font-size:20px;margin:0;letter-spacing:2px}small{color:#a5a8b0}.controls{position:absolute;bottom:0;width:100%;padding:16px;background:linear-gradient(transparent,#090a0ef5);z-index:2}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{background:#262a35;color:white;border:1px solid #626979;border-radius:9px;padding:12px;font-weight:700;flex:1;min-width:85px}button.active{background:#ee7c2d;border-color:#ee7c2d;color:#141414}#info{margin:8px 0 14px;color:#d2d3d6}#error{position:absolute;top:85px;left:15px;right:15px;color:#ffadad;z-index:5}canvas{display:block;touch-action:none}</style></head>
<body><header><h1>URBAN RUN <span style="color:#ee7c2d">/ LONDON ENDS</span></h1><small>COLLECTION 01 · TRIPLE BLACK · 3D SHOWROOM</small></header><div id="error"></div><div class="controls"><div id="info">Drag to rotate · pinch to zoom</div><div class="buttons"><button class="active" data-item="ridge">Ridge 95</button><button data-item="current">Current 110</button><button data-item="circuit">Circuit Tech</button></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.161.0';
import {createRidge95,createCurrent110,createCircuitTracksuit} from './src/streetwear.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101217);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(3.5,2.5,6.8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x282832,2.3));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,6);scene.add(key);const rim=new THREE.DirectionalLight(0x8b9dff,2.5);rim.position.set(-4,4,-5);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,.15,64),new THREE.MeshStandardMaterial({color:0x24252d,roughness:.72}));floor.position.y=-.16;scene.add(floor);
const holder=new THREE.Group();scene.add(holder);let angle=.5,zoom=6.8,active='ridge';
function setItem(name){active=name;holder.clear();const model=name==='ridge'?createRidge95():name==='current'?createCurrent110():createCircuitTracksuit();holder.add(model);model.position.y=name==='circuit'?.08:.28;model.scale.setScalar(name==='circuit'?1.05:2);document.querySelectorAll('button[data-item]').forEach(b=>b.classList.toggle('active',b.dataset.item===name));document.querySelector('#info').textContent=(name==='ridge'?'Urban Ridge 95':name==='current'?'Urban Current 110':'Urban Circuit Tech')+' · Drag to rotate · pinch to zoom';camera.position.y=name==='circuit'?2.2:1.8;}
document.querySelectorAll('button[data-item]').forEach(b=>b.addEventListener('click',()=>setItem(b.dataset.item)));
let dragging=false,lastX=0,startDist=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){angle+=(e.clientX-lastX)*.009;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('wheel',e=>zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.006,3.8,11),{passive:true});
let touches=[];renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(startDist)zoom=THREE.MathUtils.clamp(zoom+(startDist-d)*.015,3.8,11);startDist=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>startDist=0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setItem('ridge');
function frame(){requestAnimationFrame(frame);holder.rotation.y=angle;camera.position.x=zoom*.68;camera.position.z=zoom*.73;camera.lookAt(0,active==='circuit'?1.12:.5,0);renderer.render(scene,camera)}frame();
</script></body></html>
